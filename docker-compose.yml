x-kafka-app: &kafka-app
  image: confluentinc/cp-kafka:7.9.0
  depends_on:
    - zookeeper
  networks:
    - default
  healthcheck:
    test: ["CMD", "bash", "-c", "/usr/bin/kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
    interval: 10s
    timeout: 10s
    retries: 5


x-common-restart: &common-restart
# always
  restart: on-failure:3

services:

  zookeeper:
    <<: *common-restart
    image: confluentinc/cp-zookeeper:7.9.0
    container_name: demo-kafka-zookeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - 22181:2181

  kafka-0:
    <<: [*kafka-app, *common-restart]
    image: confluentinc/cp-kafka:7.9.0
    container_name: demo-kafka-0
    depends_on:
      - zookeeper
    ports:
      - ${KAFKA_0_PORT_EXTERNAL}:9094
    hostname: kafka-0
    environment:
      KAFKA_BROKER_ID: 0
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-0:9092, OUTSIDE://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
#      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:SASL_SSL,EXTERNAL:SASL_SSL,CONTROLLER:SASL_SSL
#      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://:9091,EXTERNAL://192.168.0.188:29092
      KAFKA_CLIENT_USERS: sa,da,va

  kafka-ui:
    <<: *common-restart
    container_name: demo-kafka-ui
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - 9999:8080
    environment:
      DYNAMIC_CONFIG_ENABLED: true
    depends_on:
      kafka-0:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]  
      interval: 10s  
      timeout: 5s  
      retries: 5

  


networks:
  default:
    driver: bridge
    name: kafka_network

