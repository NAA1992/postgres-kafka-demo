services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.9.0
    container_name: demo-kafka-zookeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - 22181:2181

  kafka-0:
    image: confluentinc/cp-kafka:7.9.0
    container_name: demo-kafka-0
    depends_on:
      - zookeeper
    ports:
      - ${KAFKA_0_PORT_EXTERNAL}:${KAFKA_0_PORT_EXTERNAL}
    hostname: kafka
    environment:
      KAFKA_BROKER_ID: 0
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_0_PORT_EXTERNAL},PLAINTEXT_INTERNAL://kafka-0:${KAFKA_0_PORT_INTERNAL}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
#      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:SASL_SSL,EXTERNAL:SASL_SSL,CONTROLLER:SASL_SSL
#      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://:9091,EXTERNAL://192.168.0.188:29092
      KAFKA_CLIENT_USERS: sa,da,va
    healthcheck:
      test: "bash -c 'printf \"\" > /dev/tcp/127.0.0.1/${KAFKA_0_PORT_EXTERNAL}; exit $$?;'"
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 30s

  kafka-ui:
    container_name: demo-kafka-ui
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - 9999:8080
    environment:
      DYNAMIC_CONFIG_ENABLED: true
  


networks:
  default:
    driver: bridge
    name: kafka_network

